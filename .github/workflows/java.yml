name: Java checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: xvfb-run -a mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        with:
          name: campus-hot-and-cold-java21
          path: target/campus-hot-and-cold-*.jar
